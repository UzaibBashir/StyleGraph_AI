    <text x="0" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="800" letter-spacing="-3">StyleGraph</text>
    <text x="4" y="190" fill="#f9a8d4" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">AI</text>
    <rect x="4" y="238" width="90" height="6" rx="3" fill="#f9a8d4"/>
    <text x="0" y="298" fill="#fce7f3" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">Discover your style.</text>
    <text x="0" y="340" fill="#fce7f3" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">Connect it to culture.</text>
    <text x="0" y="382" fill="#fce7f3" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400">Find brands that fit.</text>
  </g>

  <text x="84" y="650" fill="#fbcfe8" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3">IMAGE + TEXT + CULTURAL SIGNALS</text>
