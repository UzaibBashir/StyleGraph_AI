<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">StyleGraph AI project thumbnail</title>
  <desc id="desc">A dark fashion discovery graphic with connected style nodes and the words StyleGraph AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="55%">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#background)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g opacity="0.2" fill="none" stroke="#fbcfe8" stroke-width="2">
    <path d="M760 100 L1040 205 L930 450 L1170 590"/>
    <path d="M700 290 L1040 205 L1165 350"/>
    <path d="M930 450 L1165 350 L1170 590"/>
    <path d="M760 100 L700 290 L930 450"/>
  </g>
  <g fill="#fbcfe8">
    <circle cx="760" cy="100" r="7"/>
    <circle cx="1040" cy="205" r="11"/>
    <circle cx="700" cy="290" r="6"/>
    <circle cx="1165" cy="350" r="8"/>
    <circle cx="930" cy="450" r="13"/>
    <circle cx="1170" cy="590" r="7"/>
  </g>

  <g transform="translate(790 135)" filter="url(#shadow)">
    <path d="M142 32c-25 0-43 18-43 42 0 17 9 31 23 38l-8 84h56l-8-84c14-7 23-21 23-38 0-24-18-42-43-42z" fill="#fdf2f8" opacity="0.96"/>
    <path d="M99 77c-28 2-54 18-64 45l38 35 17-28 6 67h92l6-67 17 28 38-35c-10-27-36-43-64-45-8 24-25 38-43 38s-35-14-43-38z" fill="#f9a8d4"/>
    <path d="M98 157l-15 177h38l21-116 21 116h38l-15-177z" fill="#fdf2f8"/>
    <path d="M83 334h38l-8 31H70zM163 334h38l13 31h-43z" fill="#0f172a"/>
